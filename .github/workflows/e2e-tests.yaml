name: E2E tests

on:
  workflow_call:
    inputs:
      e2e_parallel_shards:
        description: Number of parallel E2E shards per OS.
        type: number
        default: 5

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}-${{ inputs.e2e_parallel_shards }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Validate inputs and compute shard matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      indexes: ${{ steps.shard-indexes.outputs.indexes }}
    steps:
      - name: Validate e2e_parallel_shards
        shell: bash
        run: |
          n="${{ inputs.e2e_parallel_shards }}"
          if ! [[ "$n" =~ ^[0-9]+$ ]] || [[ "$n" -lt 1 ]]; then
            echo "::error::e2e_parallel_shards must be at least 1, got: $n"
            exit 1
          fi
      - id: shard-indexes
        name: Compute shard indexes
        shell: bash
        run: |
          json=$(jq -nc --argjson n "${{ inputs.e2e_parallel_shards }}" '[range(1; $n + 1)]')
          echo "indexes=$json" >> "$GITHUB_OUTPUT"

  e2e-tests:
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Do not cancel sibling shards when one fails. The original Chainlit
      # failure masked four Windows shards as "cancelled" because the first
      # shard failed; every shard must report its own status.
      fail-fast: false
      matrix:
        # Pin OS images. 'windows-latest' migrating to windows-2025 changed
        # cache behaviour and exposed the latent missing-binary bug.
        os: [ubuntu-24.04, windows-2025]
        containers: ${{ fromJSON(needs.prepare.outputs.indexes) }}
    name: ${{ matrix.os }}-${{ matrix.containers }}
    env:
      BACKEND_DIR: ./backend
      CYPRESS_CACHE_FOLDER: ${{ github.workspace }}/.cypress-cache
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      # actions/cache/restore v5.0.5
      - name: Restore Cypress binary cache
        id: cypress-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: .cypress-cache
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - uses: ./.github/actions/pnpm-node-install
        name: Install Node, pnpm and dependencies.

      # Guarantee the target directory exists on a cache miss. Cypress will
      # not create a missing CYPRESS_CACHE_FOLDER automatically.
      - name: Ensure Cypress cache folder exists
        run: mkdir -p .cypress-cache
        shell: bash

      # Explicit install is the definitive fix. Package managers (pnpm,
      # Yarn Berry, npm 12+) may skip a dependency's postinstall by default,
      # so the binary is never downloaded on a cold cache.
      # npx is used for consistency across package managers and to avoid
      # ERR_PNPM_RECURSIVE_EXEC_FIRST_FAIL in pnpm workspaces where cypress
      # is a child-package dependency.
      - name: Install Cypress binary
        run: npx --no-install cypress install
        shell: bash

      # Fail before the tests start if the binary is still unusable,
      # instead of producing a misleading "test failed" status.
      - name: Verify Cypress binary
        run: npx --no-install cypress verify
        shell: bash

      # actions/cache/save v5.0.5
      - name: Save Cypress binary cache
        if: steps.cypress-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: .cypress-cache
          key: ${{ steps.cypress-cache.outputs.cache-primary-key }}
        continue-on-error: true

      - uses: ./.github/actions/uv-python-install
        name: Install Python, uv and Python & pnpm (uv does it automatically) dependencies
        with:
          working-directory: ${{ env.BACKEND_DIR }}
          uv-args: --extra tests

      - name: Run tests
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          SPLIT: ${{ inputs.e2e_parallel_shards }}
          SPLIT_INDEX1: ${{ matrix.containers }}
        run: pnpm test:e2e
        shell: bash

      # actions/upload-artifact v7.0.1
      - name: Upload screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && hashFiles('cypress/screenshots/**') != ''
        with:
          name: cypress-screenshots-${{ matrix.os }}-${{ matrix.containers }}
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7
