name: E2E tests

on:
  workflow_call:
    inputs:
      e2e_parallel_shards:
        description: Number of parallel E2E shards.
        type: number
        default: 5

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}-${{ inputs.e2e_parallel_shards }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Validate inputs and compute shard matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      indexes: ${{ steps.shard-indexes.outputs.indexes }}
    steps:
      - name: Validate e2e_parallel_shards
        shell: bash
        run: |
          n="${{ inputs.e2e_parallel_shards }}"
          if ! [[ "$n" =~ ^[0-9]+$ ]] || [[ "$n" -lt 1 ]]; then
            echo "::error::e2e_parallel_shards must be at least 1, got: $n"
            exit 1
          fi
      - id: shard-indexes
        name: Compute shard indexes
        shell: bash
        run: |
          json=$(jq -nc --argjson n "${{ inputs.e2e_parallel_shards }}" '[range(1; $n + 1)]')
          echo "indexes=$json" >> "$GITHUB_OUTPUT"

  e2e-tests:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Every shard must report its own status. With fail-fast enabled, the
      # first failure cancels the remaining shards and hides their result.
      fail-fast: false
      matrix:
        containers: ${{ fromJSON(needs.prepare.outputs.indexes) }}
    name: e2e-${{ matrix.containers }}
    env:
      BACKEND_DIR: ./backend
      # Keep the binary outside node_modules so it can be cached separately.
      CYPRESS_CACHE_FOLDER: ${{ github.workspace }}/.cypress-cache
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      # actions/cache/restore v5.0.5
      # Split restore/save: actions/cache only saves in its post-step on job
      # success, so a failing test run would discard the freshly downloaded
      # binary and force a re-download next time.
      - name: Restore Cypress binary cache
        id: cypress-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: .cypress-cache
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - uses: ./.github/actions/pnpm-node-install
        name: Install Node, pnpm and dependencies.

      # On a cache miss this directory does not exist. Cypress will not
      # create a missing CYPRESS_CACHE_FOLDER automatically.
      - name: Ensure Cypress cache folder exists
        run: mkdir -p .cypress-cache
        shell: bash

      # .npmrc sets side-effects-cache=false, so the postinstall should have
      # run during pnpm install. This explicit install is the belt-and-braces
      # guarantee: it downloads the binary even if pnpm skipped the hook.
      # npx --no-install avoids ERR_PNPM_RECURSIVE_EXEC_FIRST_FAIL in pnpm
      # workspaces where cypress is not a root dependency.
      - name: Install Cypress binary
        run: npx --no-install cypress install
        shell: bash

      # Fail here with a clear message instead of inside the test step.
      - name: Verify Cypress binary
        run: npx --no-install cypress verify
        shell: bash

      # actions/cache/save v5.0.5
      - name: Save Cypress binary cache
        if: steps.cypress-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: .cypress-cache
          key: ${{ steps.cypress-cache.outputs.cache-primary-key }}
        # Parallel shards race for the same key; a losing save is harmless.
        continue-on-error: true

      - uses: ./.github/actions/uv-python-install
        name: Install Python, uv and Python & pnpm (uv does it automatically) dependencies
        with:
          working-directory: ${{ env.BACKEND_DIR }}
          uv-args: --extra tests

      - name: Run tests
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          SPLIT: ${{ inputs.e2e_parallel_shards }}
          SPLIT_INDEX1: ${{ matrix.containers }}
        run: pnpm test:e2e
        shell: bash

      # actions/upload-artifact v7.0.1
      - name: Upload screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && hashFiles('cypress/screenshots/**') != ''
        with:
          name: cypress-screenshots-${{ matrix.containers }}
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7
