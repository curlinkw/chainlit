name: Install Node, pnpm and dependencies
description: Install a pinned Node.js + pnpm toolchain and dependencies with caching.

inputs:
  node-version:
    description: >-
      Explicit Node.js version. Leave unset to use node-version-file.
      Do not use 'lts/*'; it silently floats and was the root cause of
      the localStorage regression.
    required: false
    # No default. An empty string can conflict with node-version-file.
  node-version-file:
    description: >-
      File that pins the Node.js version. The repository must contain this
      file (a .nvmrc is committed at the root), or the caller must pass
      node-version instead.
    required: false
    default: '.nvmrc'

runs:
  using: composite
  steps:
    - name: Install pnpm
      # v5.0.0 = fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      with:
        run_install: false
        # pnpm version is read from packageManager in package.json.

    - name: Use Node.js
      # v6.3.0 = 53b83947a5a98c8d113130e565377fae1a50d02f
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
      with:
        # Omit node-version entirely when using node-version-file.
        # setup-node uses node-version over the file if both are set.
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version-file }}
        registry-url: 'https://registry.npmjs.org'
        cache: 'pnpm'
        cache-dependency-path: '**/pnpm-lock.yaml'

    - name: Install JS dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline
